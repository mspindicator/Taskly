<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard — Taskly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D1119; --surface: #161C2B; --surface-2: #1E2536;
    --accent: #2FAE73; --accent-soft: rgba(47,174,115,0.14);
    --text: #E8EAF0; --muted: #8B93A7; --border: #262E42;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  h1, h2, .brand { font-family: 'Sora', sans-serif; }

  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; padding-top: calc(12px + env(safe-area-inset-top,0px));
    background: rgba(13,17,25,0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-size: 16px; font-weight: 700; flex-shrink: 0; }
  .brand span { color: var(--accent); }
  .menu-btn {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .menu-btn svg { width: 18px; height: 18px; }

  main { max-width: 480px; margin: 0 auto; padding: 20px 20px 40px; }

  .header-balance { display: flex; gap: 14px; }
  .hb { text-align: center; }
  .hb-lbl { display: block; font-size: 8.5px; color: var(--muted); margin-bottom: 2px; }
  .hb-amt { display: block; font-size: 13px; font-weight: 800; font-family: 'Sora', sans-serif; }
  .hb-amt.avail { color: var(--accent); }
  .hb-amt.pending { color: #E8B84B; }
  .hb-amt.withdrawn { color: var(--muted); }

  .section-title { font-size: 16px; font-weight: 700; margin: 0 0 12px; }

  .task-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px; margin-bottom: 10px;
    text-decoration: none; color: var(--text);
  }
  .task-icon {
    width: 44px; height: 44px; border-radius: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .task-info { flex: 1; min-width: 0; }
  .task-info .n { font-size: 14px; font-weight: 700; margin: 0 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-info .d { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-pay { font-size: 15px; font-weight: 700; color: var(--accent); flex-shrink: 0; text-align: right; }
  .task-pay .daily { display: block; font-size: 10px; font-weight: 600; color: var(--muted); margin-top: 2px; }

  /* Drawer */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 30;
  }
  .overlay.on { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 82%; max-width: 340px;
    background: var(--surface); border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform 0.28s ease; z-index: 31;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
  }
  .drawer.on { transform: translateX(0); }

  .drawer-head { padding: 24px 20px 18px; border-bottom: 1px solid var(--border); }
  .avatar {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 800; margin-bottom: 10px;
  }
  .drawer-head .email { font-size: 13.5px; color: var(--muted); }

  .drawer-body { flex: 1; overflow-y: auto; padding: 12px 20px; }
  .drawer-item {
    width: 100%; text-align: left; background: none; border: none;
    color: var(--text); font-family: 'Inter', sans-serif; font-size: 14.5px; font-weight: 600;
    padding: 14px 4px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; cursor: pointer;
  }
  .drawer-item .chev { color: var(--muted); font-size: 12px; transition: transform 0.2s; }
  .drawer-item.expanded .chev { transform: rotate(90deg); }

  .withdraw-panel { display: none; padding: 14px 4px 18px; border-bottom: 1px solid var(--border); }
  .withdraw-panel.on { display: block; }
  .field-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .select-field, .text-field {
    width: 100%; padding: 12px 13px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px;
    margin-bottom: 12px;
  }
  .btn-send {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: var(--accent); color: #06170f; font-weight: 700; font-size: 14px;
    cursor: pointer;
  }
  .confirm-msg { font-size: 13.5px; color: var(--text); line-height: 1.5; margin: 4px 0 14px; }

  .drawer-foot { padding: 16px 20px; border-top: 1px solid var(--border); }
  .btn-logout {
    width: 100%; padding: 12px; border-radius: 10px;
    background: none; border: 1px solid var(--border); color: #E06060;
    font-weight: 700; font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <div class="brand">Task<span>ly</span></div>
  <div class="header-balance">
    <div class="hb"><span class="hb-lbl">Available</span><span class="hb-amt avail" id="hb-available">$0.00</span></div>
    <div class="hb"><span class="hb-lbl">Pending</span><span class="hb-amt pending" id="hb-pending">$0.00</span></div>
    <div class="hb"><span class="hb-lbl">Withdrawn</span><span class="hb-amt withdrawn" id="hb-withdrawn">$0.00</span></div>
  </div>
  <div class="menu-btn" onclick="openDrawer()">
    <svg viewBox="0 0 24 24" fill="none" stroke="#E8EAF0" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </div>
</header>

<main>
  <p class="section-title">Available tasks</p>
  <div id="task-list">
    <p style="color:var(--muted); font-size:13px;">Loading tasks…</p>
  </div>
</main>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>

<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="avatar">J</div>
    <p class="email">jane.doe@gmail.com</p>
  </div>
  <div class="drawer-body">
    <button class="drawer-item" id="withdraw-toggle" onclick="toggleWithdraw()">
      <span>Withdraw</span><span class="chev">›</span>
    </button>
    <div class="withdraw-panel" id="withdraw-panel">
      <div id="withdraw-form">
        <label class="field-label">Payment method</label>
        <select class="select-field" id="withdraw-method" onchange="updateAccountField()">
          <option value="Mobile Money">Mobile Money</option>
          <option value="Bank Transfer">Bank Transfer</option>
          <option value="PayPal">PayPal</option>
          <option value="Visa">Visa</option>
          <option value="Crypto">Crypto</option>
        </select>
        <label class="field-label" id="account-field-label">Mobile Money number</label>
        <input class="text-field" type="text" id="withdraw-account" placeholder="e.g. 024XXXXXXX">
        <label class="field-label">Amount to withdraw</label>
        <input class="text-field" type="number" id="withdraw-amount" placeholder="$0.00">
        <p class="fine" id="withdraw-error" style="color:#e06060; display:none; text-align:left; margin:-4px 0 10px;"></p>
        <button class="btn-send" onclick="submitWithdraw()">Send</button>
      </div>
      <div id="withdraw-confirm" style="display:none;">
        <p class="confirm-msg">✅ Request submitted. We'll review it and process your payout soon — you'll see the status update here.</p>
        <button class="btn-send" onclick="resetWithdraw()">Done</button>
      </div>
    </div>

    <button class="drawer-item"><span>Notification settings</span><span class="chev">›</span></button>
    <button class="drawer-item"><span>Help & support</span><span class="chev">›</span></button>
    <button class="drawer-item"><span>Terms & Privacy</span><span class="chev">›</span></button>
  </div>
  <div class="drawer-foot">
    <button class="btn-logout" onclick="logOut()">Log out</button>
  </div>
</div>

<!-- Supabase client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  // TODO: replace with your real Supabase project values (Project Settings > API)
  const SUPABASE_URL = 'https://aywjklspfdbjyrnyqbzj.supabase.co/rest/v1/';
  const SUPABASE_ANON_KEY = 'sb_publishable_jLyWjlVov0INtNKfRzVb1g_ktqoykq_';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  async function requireSession() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      window.location.href = 'index.html';
      return null;
    }
    return session.user;
  }

  async function loadProfile(user) {
    const { data, error } = await sb
      .from('profiles')
      .select('available_balance, pending_balance')
      .eq('id', user.id)
      .single();

    if (error) {
      console.error('Failed to load profile:', error.message);
      return;
    }

    document.getElementById('hb-available').textContent = '$' + Number(data.available_balance).toFixed(2);
    document.getElementById('hb-pending').textContent = '$' + Number(data.pending_balance).toFixed(2);
  }

  async function loadWithdrawnTotal(user) {
    const { data, error } = await sb
      .from('withdrawals')
      .select('amount')
      .eq('user_id', user.id)
      .eq('status', 'paid');

    if (error) {
      console.error('Failed to load withdrawn total:', error.message);
      return;
    }
    const total = (data || []).reduce((sum, row) => sum + Number(row.amount), 0);
    document.getElementById('hb-withdrawn').textContent = '$' + total.toFixed(2);
  }

  // Builds the outbound link for a task: if task_url is set (once a
  // provider sync fills it in), swap in the user's id as the subid and
  // open it in a new tab. Until then, falls back to a disabled-looking '#'.
  function buildTaskLink(task) {
    if (!task.task_url) return { href: '#', target: '_self' };
    const url = task.task_url.replace('{subid}', encodeURIComponent(currentUser.id));
    return { href: url, target: '_blank' };
  }

  async function loadTasks() {
    const container = document.getElementById('task-list');
    const { data, error } = await sb
      .from('tasks')
      .select('id, title, description, reward, task_url, icon_url, category')
      .eq('active', true)
      .order('reward', { ascending: false });

    if (error) {
      container.innerHTML = '<p style="color:var(--muted);font-size:13px;">Could not load tasks.</p>';
      console.error('Failed to load tasks:', error.message);
      return;
    }
    if (!data || data.length === 0) {
      container.innerHTML = '<p style="color:var(--muted);font-size:13px;">No tasks available right now — check back soon.</p>';
      return;
    }

    container.innerHTML = data.map(t => {
      const link = buildTaskLink(t);
      const iconInner = t.icon_url
        ? `<img src="${escapeHtml(t.icon_url)}" alt="" width="24" height="24" style="border-radius:6px;">`
        : `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>`;
      return `
      <a class="task-row" href="${link.href}" target="${link.target}" data-task-id="${t.id}">
        <div class="task-icon" style="background:#2b3450;">${iconInner}</div>
        <div class="task-info">
          <p class="n">${escapeHtml(t.title)}</p>
          <p class="d">${escapeHtml(t.description)}</p>
        </div>
        <div class="task-pay">$${Number(t.reward).toFixed(2)}</div>
      </a>
    `;
    }).join('');
  }

  async function initDashboard() {
    const user = await requireSession();
    if (!user) return;
    currentUser = user;

    document.querySelector('.drawer-head .email').textContent = user.email || 'Signed in';
    document.querySelector('.avatar').textContent = (user.email || '?').charAt(0).toUpperCase();

    await Promise.all([loadProfile(user), loadWithdrawnTotal(user), loadTasks()]);
  }

  async function logOut() {
    await sb.auth.signOut();
    window.location.href = 'index.html';
  }

  initDashboard();
</script>

<script>
  function openDrawer() {
    document.getElementById('drawer').classList.add('on');
    document.getElementById('overlay').classList.add('on');
  }
  function closeDrawer() {
    document.getElementById('drawer').classList.remove('on');
    document.getElementById('overlay').classList.remove('on');
  }
  function toggleWithdraw() {
    document.getElementById('withdraw-panel').classList.toggle('on');
    document.getElementById('withdraw-toggle').classList.toggle('expanded');
  }

  const ACCOUNT_FIELDS = {
    'Mobile Money': { key: 'phone', label: 'Mobile Money number', placeholder: 'e.g. 024XXXXXXX' },
    'Bank Transfer': { key: 'account_number', label: 'Bank account number', placeholder: 'Account number' },
    'PayPal':        { key: 'email', label: 'PayPal email', placeholder: 'you@example.com' },
    'Visa':          { key: 'card_last4', label: 'Card ending in', placeholder: 'Last 4 digits' },
    'Crypto':        { key: 'wallet_address', label: 'Wallet address', placeholder: 'Wallet address' }
  };

  function updateAccountField() {
    const method = document.getElementById('withdraw-method').value;
    const cfg = ACCOUNT_FIELDS[method];
    document.getElementById('account-field-label').textContent = cfg.label;
    document.getElementById('withdraw-account').placeholder = cfg.placeholder;
    document.getElementById('withdraw-account').value = '';
  }

  async function submitWithdraw() {
    const method = document.getElementById('withdraw-method').value;
    const accountValue = document.getElementById('withdraw-account').value.trim();
    const amount = parseFloat(document.getElementById('withdraw-amount').value);
    const errorEl = document.getElementById('withdraw-error');
    errorEl.style.display = 'none';

    if (!accountValue) {
      errorEl.textContent = 'Please fill in your payment details.';
      errorEl.style.display = 'block';
      return;
    }
    if (!amount || amount <= 0) {
      errorEl.textContent = 'Enter a valid amount.';
      errorEl.style.display = 'block';
      return;
    }
    if (!currentUser) {
      errorEl.textContent = 'You need to be signed in to withdraw.';
      errorEl.style.display = 'block';
      return;
    }

    const fieldKey = ACCOUNT_FIELDS[method].key;
    const { error } = await sb.from('withdrawals').insert({
      user_id: currentUser.id,
      amount: amount,
      method: method,
      account_details: { [fieldKey]: accountValue },
      status: 'pending'
    });

    if (error) {
      errorEl.textContent = 'Something went wrong: ' + error.message;
      errorEl.style.display = 'block';
      return;
    }

    document.getElementById('withdraw-form').style.display = 'none';
    document.getElementById('withdraw-confirm').style.display = 'block';
  }

  function resetWithdraw() {
    document.getElementById('withdraw-confirm').style.display = 'none';
    document.getElementById('withdraw-form').style.display = 'block';
    document.getElementById('withdraw-panel').classList.remove('on');
    document.getElementById('withdraw-toggle').classList.remove('expanded');
    document.getElementById('withdraw-amount').value = '';
    document.getElementById('withdraw-account').value = '';
  }
</script>

</body>
</html>
